[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA fallback. Serverless functions declare explicit `path` values under /api/*
# and are matched ahead of this catch-all.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
